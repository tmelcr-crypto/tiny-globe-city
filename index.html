<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tiny Globe City</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; touch-action: none; }
    #hud { position: fixed; top: 8px; left: 8px; color: #fff; font: 14px sans-serif; pointer-events: none; }

    #player-creation {
      position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 10, 20, 0.9); font: 16px sans-serif;
    }
    #player-creation form {
      display: flex; flex-direction: column; gap: 12px; width: min(90vw, 320px);
      padding: 24px; background: #121a2e; border-radius: 12px; text-align: center;
    }
    #player-creation h1 { margin: 0; font-size: 20px; color: #fff; }
    #player-creation input {
      font: 16px sans-serif; padding: 10px 12px; border-radius: 8px; border: 1px solid #334;
      background: #0b1020; color: #fff;
    }
    #player-creation button {
      font: 16px sans-serif; padding: 10px 12px; border-radius: 8px; border: none;
      background: #33ccff; color: #06202b; font-weight: bold;
    }

    #save-prompt {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); display: none;
      padding: 10px 18px; background: rgba(10, 20, 30, 0.85); color: #fff;
      font: 14px sans-serif; border-radius: 8px; text-align: center;
    }
    #save-prompt button {
      margin-top: 6px; padding: 6px 14px; font: 14px sans-serif; border: none;
      border-radius: 6px; background: #33ccff; color: #06202b;
    }
  </style>
</head>
<body>
  <div id="hud">Tiny Globe City – placeholder</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
